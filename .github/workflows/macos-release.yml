name: Build macOS release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify runner architecture
        shell: bash
        run: |
          case "${{ matrix.architecture }}" in
            arm64) test "$(uname -m)" = "arm64" ;;
            x64) test "$(uname -m)" = "x86_64" ;;
          esac

      - name: Install macOS packaging dependencies
        run: python -m pip install --disable-pip-version-check -r packaging/macos/requirements-build.txt

      - name: Build macOS package
        run: ./packaging/macos/build-release.sh --python python --skip-dependency-install

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: STS2-TUI-macOS-${{ matrix.architecture }}
          path: artifacts/STS2-TUI-macOS-${{ matrix.architecture }}.zip
          if-no-files-found: error

  macos-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos-package
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: STS2-TUI-macOS-*
          path: artifacts
          merge-multiple: true

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/STS2-TUI-macOS-*.zip
          generate_release_notes: true
