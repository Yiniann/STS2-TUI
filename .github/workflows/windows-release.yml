name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Windows packaging dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r packaging/windows/requirements-build.txt

      - name: Build Windows package
        shell: pwsh
        run: ./packaging/windows/build-release.ps1 -Python python -SkipDependencyInstall

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: STS2-TUI-Windows-x64
          path: artifacts/STS2-TUI-Windows-x64.zip
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/STS2-TUI-Windows-x64.zip
          generate_release_notes: true
